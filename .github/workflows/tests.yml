name: brew test-bot

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew:main
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v5
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      # Intel macOS lacks current bottles for the linters' build dependencies.
      # Use upstream binaries without removing any brew style/test-bot checks.
      - name: Prepare Intel macOS style linters
        if: matrix.os == 'macos-15-intel'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          brew ruby -e '
            require "formula"
            { "shellcheck" => "0.11.0", "actionlint" => "1.7.12" }.each do |name, expected|
              actual = Formula[name].version.to_s
              abort "#{name} is now #{actual}; update the pinned CI binary and checksum (expected #{expected})" unless actual == expected
            end
          '
          linter_dir=$(mktemp -d "${RUNNER_TEMP}/handmux-linters.XXXXXX")
          mkdir "${linter_dir}/bin"
          cd "${linter_dir}"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            --output shellcheck.tar.gz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.darwin.x86_64.tar.gz
          echo 'c2c15e08df0e8fbc374c335b230a7ee958c313fa5714817a59aa59f1aa594f51  shellcheck.tar.gz' | shasum -a 256 -c -
          tar -xzf shellcheck.tar.gz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_darwin_amd64.tar.gz
          echo '5b44c3bc2255115c9b69e30efc0fecdf498fdb63c5d58e17084fd5f16324c644  actionlint.tar.gz' | shasum -a 256 -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          bin/shellcheck --version
          bin/actionlint -version
          # The disposable Intel runner's test-bot forces prefix/bin first.
          # Use that standard location instead of relying on nested PATH propagation.
          brew_prefix=$(brew --prefix)
          ln -sf "${linter_dir}/bin/shellcheck" "${brew_prefix}/bin/shellcheck"
          ln -sf "${linter_dir}/bin/actionlint" "${brew_prefix}/bin/actionlint"
          diagnostic_path="${brew_prefix}/bin:${brew_prefix}/sbin:${PATH}"
          env PATH="${diagnostic_path}" HOMEBREW_PATH="${diagnostic_path}" brew ruby -e '
            require "formula"
            require "system_command"
            { "shellcheck" => ["--version"], "actionlint" => ["-version"] }.each do |name, args|
              executable = which(name, ORIGINAL_PATHS)
              expected = Formula[name].version.to_s
              puts "#{name}: selected=#{executable || "missing"}; Formula.version=#{expected}"
              abort "#{name} is missing from the test-bot PATH" unless executable
              abort "#{name} did not resolve from the Homebrew prefix" unless executable == HOMEBREW_PREFIX/"bin/#{name}"
              result = SystemCommand.run(executable, args: args, print_stderr: true)
              puts result.stdout
              actual = result.stdout[/\d+(?:\.\d+)+/]
              abort "#{name} version mismatch: #{actual.inspect}, expected #{expected}" unless result.success? && actual == expected
            end
          '

      - run: brew test-bot --only-tap-syntax --verbose
        timeout-minutes: 15
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
